name: BRICKMODE CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: brickmode-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: true
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1

      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: BRICKMODE guard (cursor config must be stable)
        run: ./scripts/guard-cursor-config.sh

      - name: Lint (0 warnings allowed)
        run: pnpm exec eslint --max-warnings 0 --no-error-on-unmatched-pattern --ignore-pattern '_tools/**' --ignore-pattern 'khashika-filters/**' --ignore-pattern 'khashika-image-fix/**' .

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: E2E (checkout spec)
        run: pnpm test:e2e tests/e2e/checkout-flow.spec.ts

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
